services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parma_resell
      POSTGRES_USER: parma
      POSTGRES_PASSWORD: parma_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parma -d parma_resell"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
